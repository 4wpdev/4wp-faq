name: Sync 4WP plugins block

on:
  schedule:
    - cron: '30 3 * * *'   # daily, after 4wpdev/4wpdev sync (02:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/sync-4wp-plugins.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: sync 4WP plugins block [skip ci]"
            git push
          fi
